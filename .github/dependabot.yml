# Dependabot (D146). Security updates are switched on in the repository's settings and open a pull
# request whenever an advisory affects a dependency. These version updates are kept to one grouped
# pull request per ecosystem, so they fit the one-PR-at-a-time rule in CLAUDE.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

# The verification sweep from CLAUDE.md, run on every pull request (D146, sped up in D149). It runs
# on Windows because the project is developed and tested there. Actions are pinned to full commit
# SHAs, and the workflow token can only read.
#
# There is no run on main after a merge: branch protection requires a pull request to be up to date
# with main before it merges, so what was tested here is exactly what lands.
#
# The browser tests are split across four machines, each still one test at a time, the parts
# balanced by each spec file's measured duration (scripts/e2e-shard.mjs, D151), and the
# "End-to-end tests" job reports their combined result — that is the name branch protection
# requires. A pull request that changes only documentation skips them; the unit tests, which
# include the personal-data guard over every Markdown file, still run.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Anything besides documentation?
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$files"
          code=$(echo "$files" | grep -v -E '^(docs/|licenses/)|\.md$|^(NOTICE|LICENSE)$' | grep -c . || true)
          if [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  checks:
    name: Lint, types, unit tests, build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test -- --run
      - run: npm run build

  e2e-shard:
    name: End-to-end tests (part ${{ matrix.shard }} of 4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node scripts/e2e-shard.mjs ${{ matrix.shard }} 4

  e2e:
    name: End-to-end tests
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Combine the four parts
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "changes: $CHANGES, code: $CODE, shards: $SHARDS"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$CODE" = "false" ]; then echo "Documentation only: browser tests not needed."; exit 0; fi
          [ "$SHARDS" = "success" ]
